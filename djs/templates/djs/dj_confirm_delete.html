{% extends 'djs/base.html' %}

{% block title %}Eliminar DJ{% endblock %}

{% block content %}
    <div class="card detalle">
        <h1>🗑️ Eliminar {{ dj.nombre }}</h1>
        <p>¿Seguro? Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'djs:dj_detail' dj.pk %}">Cancelar</a>
        </form>
    </div>
{% endblock %}
